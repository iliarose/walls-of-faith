function study(k,ci,done,doneLbl){const cs=STUDY[k];ci=Math.max(0,Math.min(cs.length-1,ci));const c=cs[ci];const nm=k==='basics'?'Bible Basics':LEVELS.find(L=>L.id===k).name;
